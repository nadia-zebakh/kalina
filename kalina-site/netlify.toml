# Site statique : aucune étape de build, Netlify publie ce dossier tel quel.
# La page 404.html est servie automatiquement pour les adresses inconnues.

[build]
  publish = "."

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "SAMEORIGIN"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"

# Images : cache navigateur d'une semaine. Pour remplacer une image,
# changer son nom de fichier plutôt que de l'écraser.
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=604800, stale-while-revalidate=86400"
